  @index(fields: ["status"])
  @index(fields: ["groupId"]) {
  id: String! @col(dataType: "varchar(128)")
  name: String! @col(dataType: "varchar(160)")
  season: Season!
  category: Category!
  group: TournamentGroup
  status: TournamentStatus! @default(value: UPCOMING)
  legs: Int! @default(value: 2)
  footballType: FootballType! @default(value: FUT_11)
  durationMinutes: Int! @default(value: 90)
  # Minutos que un partido sigue «En vivo» en la portada después de su hora de fin.
  liveMarginMinutes: Int! @default(value: 10)
  startDate: Date
  description: String! @default(value: "")
  # Premio al campeón en texto libre («$25,000 MXN», «Trofeo + uniformes»); vacío = sin premio.
  prize: String! @col(dataType: "varchar(60)") @default(value: "")
  createdAt: Timestamp! @default(expr: "request.time")
}

