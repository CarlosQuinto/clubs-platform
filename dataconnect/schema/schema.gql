# Esquema de Clubs Platform para Firebase SQL Connect.
# Los id String conservan los ids históricos; las filas nuevas usan UUID.
# Las horas HH:mm son String: SQL Connect no tiene escalar Time.

enum MemberRole {
  ADMIN
  DT
  PRENSA
  TESORERO
}

enum TournamentStatus {
  UPCOMING
  ACTIVE
  FINISHED
}

enum FootballType {
  FUT_7
  FUT_9
  FUT_11
}

enum MatchStatus {
  UNSCHEDULED
  SCHEDULED
  PLAYED
}

enum CourtHoldSource {
  MATCH
  MANUAL
}

enum EventType {
  PARTIDO
  ENTRENAMIENTO
}

enum FriendlyMatchType {
  AMISTOSO
}

enum CardColor {
  YELLOW
  RED
}

enum TransactionType {
  INGRESO
  GASTO
}

enum TransactionSource {
  MANUAL
  LEGACY_AMOUNT_PAID
}

enum GoalStatus {
  ACTIVE
  COMPLETED
}

enum InventoryCondition {
  BUENO
  MALO
  PERDIDO
}

enum InquiryStatus {
  NEW
  DONE
}

enum TeamApplicationStatus {
  PENDING
  APPROVED
  REJECTED
}

enum InviteKind {
  SIGNUP
  ACCEPT
}

enum AdPlacementKind {
  HOME
  TOURNAMENT
  CLUB
  TEAMS
}

enum AdStatus {
  PROGRAMADO
  EN_CURSO
  PAUSADO
  EXPIRADO
}

type Locality @table(name: "localities", key: "id") {
  id: String! @col(dataType: "varchar(128)")
  name: String! @col(dataType: "varchar(120)")
  createdAt: Timestamp
}

type User @table(name: "users", key: "id")
  @unique(fields: ["email"])
  @index(fields: ["email"]) {
  id: String! @col(dataType: "varchar(128)")
  email: String! @col(dataType: "varchar(320)")
  displayName: String! @col(dataType: "varchar(160)") @default(value: "")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type PlatformSettings @table(name: "platform_settings", key: "id") {
  id: String! @col(dataType: "varchar(16)") @default(value: "config")
  name: String! @col(dataType: "varchar(160)") @default(value: "")
  motto: String! @col(dataType: "varchar(240)") @default(value: "")
  headline: String! @col(dataType: "varchar(240)") @default(value: "")
  tagline: String! @col(dataType: "varchar(400)") @default(value: "")
  logoUrl: String
  instagram: String
  facebook: String
  x: String
  youtube: String
  whatsapp: String
  courtsEnabled: Boolean! @default(value: false)
  courtSlotMinutes: Int! @default(value: 60)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type PlatformAdmin @table(name: "platform_admins", key: ["user"]) {
  user: User!
  email: String! @col(dataType: "varchar(320)")
}

type PlatformHeroImage @table(name: "platform_hero_images")
  @unique(fields: ["position"]) {
  id: UUID! @default(expr: "uuidV4()")
  position: Int!
  url: String!
}

type CourtOpenWindow @table(name: "court_open_windows") {
  id: UUID! @default(expr: "uuidV4()")
  weekday: Int!
  startTime: String! @col(dataType: "varchar(5)")
  endTime: String! @col(dataType: "varchar(5)")
}

type PlatformAdminInvite @table(name: "platform_admin_invites", key: "emailKey")
  @unique(fields: ["email"]) {
  emailKey: String! @col(dataType: "varchar(320)")
  email: String! @col(dataType: "varchar(320)")
  invitedBy: User
  createdAt: Timestamp! @default(expr: "request.time")
}

type Category @table(name: "categories", key: "id")
  @index(fields: ["sortOrder"]) {
  id: String! @col(dataType: "varchar(128)")
  name: String! @col(dataType: "varchar(120)")
  sortOrder: Int!
}

type Season @table(name: "seasons", key: "id")
  @index(fields: ["active"]) {
  id: String! @col(dataType: "varchar(128)")
  name: String! @col(dataType: "varchar(160)")
  startDate: Date
  endDate: Date
  active: Boolean! @default(value: false)
}

type Club @table(name: "clubs", key: "id")
  @unique(fields: ["slug"])
  @index(fields: ["localityId"])
  @index(fields: ["active"])
  @index(fields: ["deletedAt"]) {
  id: String! @col(dataType: "varchar(128)")
  slug: String! @col(dataType: "varchar(40)")
  name: String! @col(dataType: "varchar(160)")
  description: String! @default(value: "")
  locality: Locality
  location: String! @col(dataType: "varchar(160)") @default(value: "")
  presidentPhone: String! @col(dataType: "varchar(40)") @default(value: "")
  logoUrl: String
  active: Boolean! @default(value: true)
  # Motivo visible en la página del club mientras está desactivado.
  disabledReason: String
  createdBy: User
  createdAt: Timestamp! @default(expr: "request.time")
  # Borrado lógico: el club se oculta, conserva su historial y su slug queda reservado.
  deletedAt: Timestamp
}

type ClubHeroImage @table(name: "club_hero_images")
