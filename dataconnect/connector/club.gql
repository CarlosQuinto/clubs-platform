mutation SetClubEventScore(
  $id: String!
  $clubId: String!
  $scoreOurs: Int
  $scoreTheirs: Int
  $penaltiesOurs: Int
  $penaltiesTheirs: Int
) @auth(level: USER) {
  event: _executeReturningFirst(
    sql: """
      UPDATE club_events
      SET score_ours = $3,
          score_theirs = $4,
          penalties_ours = $5,
          penalties_theirs = $6
      WHERE id = $1
        AND club_id = $2
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $7)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $2 AND user_id = $7 AND role::text IN ('ADMIN', 'DT')
          )
        )
      RETURNING id
    """
    params: [
      $id
      $clubId
      $scoreOurs
      $scoreTheirs
      $penaltiesOurs
      $penaltiesTheirs
      { _expr: "auth.uid" }
    ]
  )
}

