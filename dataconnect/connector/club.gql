mutation ReplaceClubEventStats($id: String!, $clubId: String!, $stats: Any) @auth(level: USER) {
  event: _executeReturningFirst(
    sql: """
      WITH allowed AS (
        SELECT e.id
        FROM club_events e
        WHERE e.id = $1
          AND e.club_id = $2
          AND (
            EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
            OR EXISTS (
              SELECT 1 FROM club_members
              WHERE club_id = $2 AND user_id = $4 AND role::text IN ('ADMIN', 'DT')
            )
          )
      ),
      drop_goals AS (
        DELETE FROM club_event_goals g USING allowed WHERE g.event_id = allowed.id
      ),
      drop_cards AS (
        DELETE FROM club_event_cards c USING allowed WHERE c.event_id = allowed.id
      ),
      drop_keepers AS (
        DELETE FROM club_event_goalkeepers k USING allowed WHERE k.event_id = allowed.id
      ),
      add_goals AS (
        INSERT INTO club_event_goals (
          event_id, sort_order, scorer_id, assist_id, is_penalty, is_own_goal
        )
        SELECT allowed.id,
          (ord - 1)::int,
          (SELECT p.id FROM players p WHERE p.id = goal->>'scorer' AND p.club_id = $2),
          (SELECT p.id FROM players p WHERE p.id = goal->>'assist' AND p.club_id = $2),
          COALESCE((goal->>'isPenalty')::boolean, false),
          COALESCE((goal->>'isOwnGoal')::boolean, false)
        FROM allowed
        CROSS JOIN jsonb_array_elements(COALESCE(($3)::jsonb->'goals', '[]'::jsonb))
          WITH ORDINALITY AS row(goal, ord)
      ),
      add_yellow AS (
        INSERT INTO club_event_cards (event_id, player_id, color)
        SELECT allowed.id, p.id, 'YELLOW'::card_color
        FROM allowed
        CROSS JOIN jsonb_array_elements_text(COALESCE(($3)::jsonb->'yellowCards', '[]'::jsonb)) AS card(pid)
        JOIN players p ON p.id = card.pid AND p.club_id = $2
      ),
      add_red AS (
        INSERT INTO club_event_cards (event_id, player_id, color)
        SELECT allowed.id, p.id, 'RED'::card_color
        FROM allowed
        CROSS JOIN jsonb_array_elements_text(COALESCE(($3)::jsonb->'redCards', '[]'::jsonb)) AS card(pid)
        JOIN players p ON p.id = card.pid AND p.club_id = $2
      ),
      add_keepers AS (
        INSERT INTO club_event_goalkeepers (event_id, player_id, conceded, saves)
        SELECT allowed.id,
          p.id,
          COALESCE((gk->>'conceded')::int, 0),
          COALESCE((gk->>'saves')::int, 0)
        FROM allowed
        CROSS JOIN jsonb_array_elements(COALESCE(($3)::jsonb->'goalkeepers', '[]'::jsonb)) AS row(gk)
        JOIN players p ON p.id = gk->>'id' AND p.club_id = $2
      )
      UPDATE club_events e
      SET mvp_id = (
        SELECT p.id FROM players p
        WHERE p.id = ($3)::jsonb->>'mvp' AND p.club_id = $2
      )
      FROM allowed
      WHERE e.id = allowed.id
      RETURNING e.id
    """
    params: [$id, $clubId, $stats, { _expr: "auth.uid" }]
  )
}

