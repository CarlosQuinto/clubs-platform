      SELECT m.id, $2, $3
      FROM matches m
      WHERE m.id = $1
        AND (m.home_club_id = $2 OR m.away_club_id = $2)
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $2 AND user_id = $4 AND role::text IN ('ADMIN', 'DT')
          )
        )
      ON CONFLICT (match_id, club_id) DO UPDATE SET lineup = EXCLUDED.lineup
      RETURNING match_id
    """
    params: [$matchId, $clubId, $lineup, { _expr: "auth.uid" }]
  )
}

