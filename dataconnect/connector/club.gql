mutation InsertClubAvailability($clubId: String!, $windows: Any) @auth(level: USER) {
  window: _executeReturningFirst(
    sql: """
      INSERT INTO club_availability_windows (id, club_id, weekday, start_time, end_time)
      SELECT gen_random_uuid(), $1,
        (row->>'day')::int,
        row->>'start',
        row->>'end'
      FROM jsonb_array_elements(COALESCE(($2)::jsonb, '[]'::jsonb)) AS row
      WHERE (row->>'day')::int BETWEEN 1 AND 7
        AND COALESCE(row->>'start', '') < COALESCE(row->>'end', '')
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $1 AND user_id = $3 AND role::text IN ('ADMIN', 'DT')
          )
        )
      RETURNING club_id
    """
    params: [$clubId, $windows, { _expr: "auth.uid" }]
  )
}

mutation ReplaceClubAvailability($clubId: String!, $windows: Any) @auth(level: USER) {
  window: _executeReturningFirst(
    sql: """
      WITH allowed AS (
        SELECT $1::varchar AS club_id
        WHERE EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
           OR EXISTS (
             SELECT 1 FROM club_members
             WHERE club_id = $1 AND user_id = $3 AND role::text IN ('ADMIN', 'DT')
           )
      ),
      cleared AS (
        DELETE FROM club_availability_windows AS slot
        USING allowed
        WHERE slot.club_id = allowed.club_id
      )
      INSERT INTO club_availability_windows (club_id, weekday, start_time, end_time)
      SELECT allowed.club_id,
        (row->>'day')::int,
        row->>'start',
        row->>'end'
      FROM allowed
      CROSS JOIN jsonb_array_elements(COALESCE(($2)::jsonb, '[]'::jsonb)) AS row
      WHERE (row->>'day')::int BETWEEN 1 AND 7
        AND COALESCE(row->>'start', '') < COALESCE(row->>'end', '')
      RETURNING club_id
    """
    params: [$clubId, $windows, { _expr: "auth.uid" }]
  )
}

mutation SaveClubPortada(
  $id: String!
  $name: String!
  $description: String!
  $location: String!
  $urls: Any @retired
) @auth(level: USER) {
  club: _executeReturningFirst(
    sql: """
      UPDATE clubs
      SET name = $2,
          description = $3,
          location = $4,
          locality_id = CASE
            WHEN locality_id IS NOT NULL
             AND EXISTS (
               SELECT 1 FROM localities
               WHERE localities.id = clubs.locality_id
                 AND localities.name = $4
             )
            THEN locality_id
            ELSE NULL
          END
      WHERE id = $1
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $5)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $1 AND user_id = $5 AND role::text IN ('ADMIN', 'PRENSA')
          )
        )
      RETURNING id
    """
    params: [$id, $name, $description, $location, { _expr: "auth.uid" }]
  )
}

