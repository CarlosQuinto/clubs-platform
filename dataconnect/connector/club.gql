mutation ReplaceClubEventAttendees($id: String!, $clubId: String!, $labels: Any) @auth(level: USER) {
  event: _executeReturningFirst(
    sql: """
      WITH allowed AS (
        SELECT e.id
        FROM club_events e
        WHERE e.id = $1
          AND e.club_id = $2
          AND (
            EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
            OR EXISTS (
              SELECT 1 FROM club_members
              WHERE club_id = $2 AND user_id = $4 AND role::text IN ('ADMIN', 'DT')
            )
          )
      ),
      cleared AS (
        DELETE FROM club_event_attendees a
        USING allowed
        WHERE a.event_id = allowed.id
      )
      INSERT INTO club_event_attendees (event_id, player_id, raw_label)
      SELECT allowed.id,
        (SELECT p.id FROM players p WHERE p.id = elem AND p.club_id = $2),
        elem
      FROM allowed
      CROSS JOIN jsonb_array_elements_text(($3)::jsonb) AS elem
      WHERE elem <> ''
      RETURNING event_id
    """
    params: [$id, $clubId, $labels, { _expr: "auth.uid" }]
  )
}

