mutation SaveGalleryPhoto(
  $albumId: String!
  $clubId: String!
  $albumName: String!
  $photoId: String!
  $url: String!
  $caption: String!
  $takenAt: Timestamp!
) @auth(level: USER) {
  photo: _executeReturningFirst(
    sql: """
      WITH allowed AS (
        SELECT $2::varchar AS club_id
        WHERE EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $8)
           OR EXISTS (
             SELECT 1 FROM club_members
             WHERE club_id = $2 AND user_id = $8 AND role::text IN ('ADMIN', 'DT')
           )
      ),
      album AS (
        INSERT INTO albums (id, club_id, name)
        SELECT $1, allowed.club_id, $3
        FROM allowed
        ON CONFLICT (club_id, name) DO UPDATE SET name = EXCLUDED.name
        RETURNING id
      )
      INSERT INTO gallery_photos (id, album_id, url, caption, sort_order, taken_at)
      SELECT $4,
        album.id,
        $5,
        $6,
        COALESCE((SELECT MAX(sort_order) + 1 FROM gallery_photos WHERE album_id = album.id), 0),
        $7
      FROM album
      RETURNING id
    """
    params: [
      $albumId
      $clubId
      $albumName
      $photoId
      $url
      $caption
      $takenAt
      { _expr: "auth.uid" }
    ]
  )
}

mutation SwapGalleryPhotos($clubId: String!, $firstId: String!, $secondId: String!) @auth(level: USER) {
  swapped: _execute(
    sql: """
      UPDATE gallery_photos AS photo
      SET sort_order = other.sort_order,
          taken_at = other.taken_at
      FROM gallery_photos AS other
      WHERE photo.id IN ($2, $3)
        AND other.id IN ($2, $3)
        AND photo.id <> other.id
        AND EXISTS (
          SELECT 1 FROM albums album
          WHERE album.id = photo.album_id
            AND album.club_id = $1
            AND (
              EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
              OR EXISTS (
                SELECT 1 FROM club_members
                WHERE club_id = $1 AND user_id = $4 AND role::text IN ('ADMIN', 'DT')
              )
            )
        )
    """
    params: [$clubId, $firstId, $secondId, { _expr: "auth.uid" }]
  )
}

mutation PromoteGalleryPhoto($clubId: String!, $photoId: String!) @auth(level: USER) {
  photo: _executeReturningFirst(
    sql: """
      UPDATE gallery_photos AS photo
      SET taken_at = (
        SELECT MAX(sibling.taken_at) + interval '1 second'
        FROM gallery_photos sibling
        WHERE sibling.album_id = photo.album_id
      )
      WHERE photo.id = $2
        AND EXISTS (
          SELECT 1 FROM albums album
          WHERE album.id = photo.album_id
            AND album.club_id = $1
            AND (
              EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
              OR EXISTS (
                SELECT 1 FROM club_members
                WHERE club_id = $1 AND user_id = $3 AND role::text IN ('ADMIN', 'DT')
              )
            )
        )
      RETURNING photo.id
    """
    params: [$clubId, $photoId, { _expr: "auth.uid" }]
  )
}

mutation DeleteGalleryPhoto($clubId: String!, $photoId: String!) @auth(level: USER) {
  deleted: _execute(
    sql: """
      DELETE FROM gallery_photos AS photo
