query CourtsPage($date: Date!)
  @auth(level: PUBLIC, insecureReason: "El apartado de canchas es público.") {
  platformSettings(id: "config") {
    courtsEnabled
    courtSlotMinutes
    whatsapp
  }
  courtOpenWindows {
    weekday
    startTime
    endTime
  }
  courts(where: { active: { eq: true } }, orderBy: [{ sortOrder: ASC }]) {
    id
    name
    description
    hourlyRate
    imageUrl
  }
  courtHolds(where: { holdDate: { eq: $date } }) {
    startTime
    endTime
    court { id }
  }
}

query CourtHoldsOnDate($date: Date!) @auth(level: PUBLIC) {
  courtHolds(where: { holdDate: { eq: $date } }, orderBy: [{ startTime: ASC }]) {
    id
    holdDate
    startTime
    endTime
    source
    note
    court { id name }
    match { id }
  }
}

query LiveAds($today: Date!, $placement: AdPlacementKind!) @auth(level: PUBLIC) {
  adPlacements(
    where: {
      placement: { eq: $placement }
      ad: {
        status: { eq: EN_CURSO }
        startsOn: { le: $today }
        endsOn: { ge: $today }
      }
    }
    orderBy: [{ ad: { sortOrder: ASC } }]
  ) {
    placement
    ad { id brand imageUrl href sortOrder startsOn endsOn }
  }
}

query MyMemberships($userId: String!) @auth(level: USER) {
  clubMembers(where: { user: { id: { eq: $userId } } }) {
    role
    email
    club { id slug name logoUrl }
  }
}

query MyOpenClubInvites($emailKey: String!) @auth(level: USER) {
  clubInvites(where: { emailKey: { eq: $emailKey }, kind: { ne: ACCEPT } }) {
    token
    role
    club { id slug name logoUrl }
  }
}

query PlayerContributionTotals($clubId: String!) @auth(level: USER) {
  playerContributionTotals(where: { club: { id: { eq: $clubId } } }) {
    total
    player { id name }
  }
}
