query TournamentsBySeason($seasonId: String!) @auth(level: PUBLIC) {
  tournaments(where: { season: { id: { eq: $seasonId } } }) {
    id
    name
    status
    legs
    footballType
    durationMinutes
    startDate
    season { id name }
    category { id name sortOrder }
  }
}

query TournamentScreen($id: String!)
  @auth(level: PUBLIC, insecureReason: "La ficha del torneo es pública.") {
  tournaments(where: { id: { eq: $id } }, limit: 1) {
    name
    status
    footballType
    startDate
    durationMinutes
    season { name }
    category { name }
    tournamentPodiums_on_tournament(orderBy: [{ place: ASC }]) {
      place
      club { name slug }
    }
  }
  matches(
    where: { tournament: { id: { eq: $id } } }
    orderBy: [{ roundNumber: ASC }, { matchDate: ASC }]
  ) {
    id
    roundLabel
    matchDate
    startTime
    venue
    status
    homeScore
    awayScore
    walkover
    homeClub { id name slug logoUrl }
    awayClub { id name slug logoUrl }
    court { id name }
  }
  tournamentStandings(
    where: { tournament: { id: { eq: $id } } }
    orderBy: [{ standingRank: ASC }]
  ) {
    standingRank
    pj
    g
    e
    p
    gf
    gc
    dg
    pts
    club { id name slug logoUrl }
  }
  tournamentScorers(
    where: { tournament: { id: { eq: $id } } }
    orderBy: [{ goals: DESC }, { assists: DESC }, { playerName: ASC }]
  ) {
    playerName
    goals
    assists
    player { id imageUrl }
    club { id name logoUrl }
  }
}

query MatchSummary($matchId: String!)
  @auth(level: PUBLIC, insecureReason: "El resumen de un partido del torneo es público.") {
  matches(where: { id: { eq: $matchId } }, limit: 1) {
    matchGoals_on_match(orderBy: [{ sortOrder: ASC }]) {
      club { id }
      scorerName
      assistName
      scorer { name }
      assist { name }
      isPenalty
      isOwnGoal
    }
    matchCards_on_match {
      club { id }
      color
      playerName
      player { name }
    }
  }
}

query MatchScoreSheet($matchId: String!) @auth(level: USER) {
  matches(where: { id: { eq: $matchId } }, limit: 1) {
    homeScore
    awayScore
    homeClub {
      id
      name
      players_on_club(where: { active: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        name
      }
    }
    awayClub {
      id
      name
      players_on_club(where: { active: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        name
      }
    }
    matchGoals_on_match(orderBy: [{ sortOrder: ASC }]) {
      club { id }
      scorer { id }
      assist { id }
      isPenalty
      isOwnGoal
    }
    matchCards_on_match {
      club { id }
      color
      player { id }
    }
  }
}

query CourtBusyOnDate($date: Date!) @auth(level: USER) {
  courtHolds(where: { holdDate: { eq: $date } }) {
    startTime
    endTime
    court { id }
    match { id }
  }
}

query MatchesByTournament($tournamentId: String!) @auth(level: PUBLIC) {
  matches(
    where: { tournament: { id: { eq: $tournamentId } } }
    orderBy: [{ roundNumber: ASC }, { matchDate: ASC }]
  ) {
    id
    roundLabel
    roundNumber
    matchDate
    startTime
    venue
    status
    homeScore
    awayScore
    walkover
    homeClub { id name slug }
    awayClub { id name slug }
    court { id name }
  }
}

query ClubScopedMatches(
  $clubId: String!
  $seasonId: String!
  $categoryId: String!
) @auth(level: PUBLIC) {
  matches(
    where: {
      _and: [
        {
          _or: [
            { homeClub: { id: { eq: $clubId } } }
            { awayClub: { id: { eq: $clubId } } }
          ]
        }
        { tournament: { season: { id: { eq: $seasonId } } } }
        { tournament: { category: { id: { eq: $categoryId } } } }
      ]
    }
    orderBy: [{ matchDate: ASC }, { startTime: ASC }]
  ) {
    id
    roundLabel
    matchDate
    startTime
    status
    homeScore
    awayScore
    homeClub { id name }
    awayClub { id name }
    tournament { id name season { id } category { id } }
  }
}

query UpcomingMatches($from: String!, $limit: Int!) @auth(level: PUBLIC) {
  matchListings(
    where: { startsAt: { ge: $from } }
    orderBy: [{ startsAt: ASC }]
    limit: $limit
  ) {
    startsAt
    matchDate
    startTime
    venue
    homeClub { id name slug }
    awayClub { id name slug }
    tournament { id name }
    category { id name }
    match { id }
  }
}

query TournamentStandings($tournamentId: String!) @auth(level: PUBLIC) {
