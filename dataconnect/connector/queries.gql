query ClubBySlug($slug: String!) @auth(level: PUBLIC) {
  clubs(where: { slug: { eq: $slug } }, limit: 1) {
    id
    slug
    name
    description
    location
    presidentPhone
    logoUrl
    active
    locality { id name }
  }
}

query TeamsPage
  @auth(level: PUBLIC, insecureReason: "El directorio y el ranking de equipos son públicos.") {
  clubs(where: { active: { eq: true } }, orderBy: [{ name: ASC }]) {
    name
    slug
    logoUrl
    location
    presidentPhone
    locality { name }
  }
  seasons(orderBy: [{ startDate: DESC }]) {
    id
    name
    active
    startDate
  }
  categories(orderBy: [{ sortOrder: ASC }]) {
    id
    name
    sortOrder
  }
  tournaments {
    season { id }
    category { id }
    tournamentClubs_on_tournament {
      club { name slug }
    }
  }
  matches(where: { status: { eq: PLAYED } }) {
    homeScore
    awayScore
    homeClub { name slug }
    awayClub { name slug }
    tournament {
      season { id }
      category { id }
    }
  }
}

