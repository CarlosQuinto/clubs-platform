    orderBy: [{ matchDate: ASC }, { startTime: ASC }]
  ) {
    id
    matchDate
    startTime
    venue
    homeClub { name slug logoUrl }
    awayClub { name slug logoUrl }
    court { id name }
    tournament {
      id
      name
      status
      category { name }
    }
  }
}

