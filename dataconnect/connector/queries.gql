query HomePage($today: Date!)
  @auth(level: PUBLIC, insecureReason: "La portada, los próximos partidos y los torneos vigentes son públicos.") {
  platformSettings(id: "config") {
    headline
    tagline
    courtsEnabled
    whatsapp
  }
  platformHeroImages(orderBy: [{ position: ASC }]) {
    url
  }
  tournaments(
    where: {
      _or: [{ status: { eq: ACTIVE } }, { status: { eq: UPCOMING } }]
    }
  ) {
    id
    name
    status
    footballType
    startDate
    season { name startDate }
    category { name sortOrder }
    tournamentClubs_on_tournament { _count }
    matches_on_tournament(where: { status: { eq: PLAYED } }) { _count }
  }
  matches(
    where: {
      status: { eq: SCHEDULED }
      matchDate: { ge: $today }
      tournament: {
        _or: [{ status: { eq: ACTIVE } }, { status: { eq: UPCOMING } }]
      }
    }
    orderBy: [{ matchDate: ASC }, { startTime: ASC }]
    limit: 30
  ) {
    matchDate
    startTime
    venue
    homeClub { name logoUrl }
    awayClub { name logoUrl }
    tournament {
      id
      name
      status
      category { name }
    }
  }
  adPlacements(
    where: {
      placement: { eq: HOME }
      ad: {
        status: { eq: EN_CURSO }
        startsOn: { le: $today }
        endsOn: { ge: $today }
      }
    }
  ) {
    ad {
      brand
      imageUrl
      href
      startsOn
      endsOn
      status
      sortOrder
    }
  }
}

