mutation SubmitInquiry(
  $id: String!
  $name: String!
  $email: String!
  $phone: String!
  $topic: String!
  $message: String!
) @auth(level: PUBLIC, insecureReason: "Cualquiera puede escribir. El mensaje queda como nuevo.") {
  inquiry: _executeReturningFirst(
    sql: """
      INSERT INTO inquiries (
        id, name, email, phone, topic, message, status, created_at
      )
      VALUES ($1, $2, $3, $4, $5, $6, 'NEW'::inquiry_status, CURRENT_TIMESTAMP)
      RETURNING id
    """
    params: [$id, $name, $email, $phone, $topic, $message]
  )
}

mutation SubmitTeamApplication(
  $id: String!
  $captainName: String!
  $captainEmail: String!
  $captainPhone: String!
  $teamName: String!
) @auth(level: PUBLIC, insecureReason: "Cualquiera puede solicitar un equipo. La solicitud queda pendiente.") {
  application: _executeReturningFirst(
    sql: """
      INSERT INTO team_applications (
        id, captain_name, captain_email, captain_phone, team_name, status, created_at
      )
      VALUES (
        $1, $2, $3, $4, $5, 'PENDING'::team_application_status, CURRENT_TIMESTAMP
      )
      RETURNING id
    """
    params: [$id, $captainName, $captainEmail, $captainPhone, $teamName]
  )
}

mutation EnsureMyProfile($email: String!, $displayName: String!) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      email: $email
      displayName: $displayName
      updatedAt_expr: "request.time"
    }
  )
}

mutation SavePlayer(
  $id: String!
  $clubId: String!
  $name: String!
  $shirtNumber: String!
  $position: String!
  $variant: String @retired
  $birthDate: Date @retired
  $imageUrl: String @retired
  $isCoach: Boolean = false
  $active: Boolean = true
  $detail: Any
) @auth(level: USER) {
  player: _executeReturningFirst(
    sql: """
      INSERT INTO players (
        id, club_id, name, shirt_number, position, variant,
        birth_date, image_url, is_coach, active, created_at
      )
      SELECT $1, $2, $3, $4, $5,
        COALESCE($6->>'variant', ''),
        NULLIF($6->>'birthDate', '')::date,
        COALESCE($6->>'imageUrl', ''),
        $7, $8, CURRENT_TIMESTAMP
      WHERE EXISTS (
        SELECT 1 FROM platform_admins WHERE user_id = $9
      ) OR EXISTS (
        SELECT 1 FROM club_members
        WHERE club_id = $2
          AND user_id = $9
          AND role::text IN ('ADMIN', 'DT')
      )
      ON CONFLICT (id) DO UPDATE SET
        name = EXCLUDED.name,
        shirt_number = EXCLUDED.shirt_number,
        position = EXCLUDED.position,
        variant = EXCLUDED.variant,
        birth_date = EXCLUDED.birth_date,
        image_url = EXCLUDED.image_url,
        is_coach = EXCLUDED.is_coach,
        active = EXCLUDED.active
      RETURNING id, name
    """
    params: [$id, $clubId, $name, $shirtNumber, $position, $detail, $isCoach, $active, { _expr: "auth.uid" }]
  )
}

mutation DeletePlayer($id: String!, $clubId: String!) @auth(level: USER) {
  deleted: _execute(
    sql: """
      DELETE FROM players
      WHERE id = $1
        AND club_id = $2
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $2
              AND user_id = $3
              AND role::text IN ('ADMIN', 'DT')
          )
        )
    """
    params: [$id, $clubId, { _expr: "auth.uid" }]
  )
}

mutation SaveClubEvent(
  $id: String!
  $clubId: String!
  $eventType: String!
  $matchType: String
  $title: String!
  $eventDate: Date!
  $eventTime: String!
  $location: String @retired
  $routine: Any @retired
  $detail: Any
) @auth(level: USER) {
  event: _executeReturningFirst(
    sql: """
      INSERT INTO club_events (
        id, club_id, event_type, match_type, title,
        event_date, event_time, location, routine, created_at
      )
      SELECT
        $1, $2, $3::event_type, NULLIF($4, '')::friendly_match_type, $5,
        $6, $7, COALESCE($8->>'location', ''), $8->'routine', CURRENT_TIMESTAMP
      WHERE EXISTS (
        SELECT 1 FROM platform_admins WHERE user_id = $9
      ) OR EXISTS (
        SELECT 1 FROM club_members
        WHERE club_id = $2
          AND user_id = $9
          AND role::text IN ('ADMIN', 'DT')
      )
      ON CONFLICT (id) DO UPDATE SET
        event_type = EXCLUDED.event_type,
        match_type = EXCLUDED.match_type,
        title = EXCLUDED.title,
        event_date = EXCLUDED.event_date,
        event_time = EXCLUDED.event_time,
        location = EXCLUDED.location,
        routine = EXCLUDED.routine
      RETURNING id, title
    """
    params: [
      $id
      $clubId
      $eventType
      $matchType
      $title
      $eventDate
      $eventTime
      $detail
      { _expr: "auth.uid" }
    ]
  )
}

mutation DeleteClubEvent($id: String!, $clubId: String!) @auth(level: USER) {
  deleted: _execute(
    sql: """
      WITH allowed AS (
        SELECT e.id
        FROM club_events e
        WHERE e.id = $1
          AND e.club_id = $2
          AND (
            EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
            OR EXISTS (
              SELECT 1 FROM club_members m
              WHERE m.club_id = e.club_id
                AND m.user_id = $3
                AND m.role::text IN ('ADMIN', 'DT')
            )
          )
      ),
      drop_attendees AS (
        DELETE FROM club_event_attendees a
        USING allowed
        WHERE a.event_id = allowed.id
      ),
      drop_goals AS (
        DELETE FROM club_event_goals g
        USING allowed
        WHERE g.event_id = allowed.id
      ),
      drop_cards AS (
        DELETE FROM club_event_cards c
        USING allowed
        WHERE c.event_id = allowed.id
      ),
      drop_keepers AS (
        DELETE FROM club_event_goalkeepers k
        USING allowed
        WHERE k.event_id = allowed.id
      ),
      drop_photos AS (
        DELETE FROM club_event_photos p
        USING allowed
        WHERE p.event_id = allowed.id
      )
      DELETE FROM club_events e
      USING allowed
      WHERE e.id = allowed.id
    """
    params: [$id, $clubId, { _expr: "auth.uid" }]
  )
}

mutation AddTransaction(
  $id: String!
  $clubId: String!
  $type: String!
  $description: String!
  $category: String!
  $amount: Float!
  $txnDate: Date!
) @auth(level: USER) {
  transaction: _executeReturningFirst(
    sql: """
      INSERT INTO transactions (
        id, club_id, type, description, category, amount, txn_date, source, created_at
      )
      SELECT $1, $2, $3::transaction_type, $4, $5, $6, $7, 'MANUAL'::transaction_source, CURRENT_TIMESTAMP
      WHERE $6 >= 0
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $8)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $2
              AND user_id = $8
              AND role::text IN ('ADMIN', 'TESORERO')
          )
        )
      RETURNING id, amount
    """
    params: [
      $id
      $clubId
      $type
      $description
      $category
      $amount
      $txnDate
      { _expr: "auth.uid" }
    ]
  )
}

mutation SetGoalContribution(
  $goalId: String!
  $playerId: String!
  $amount: Float!
) @auth(level: USER) {
  contribution: _executeReturningFirst(
    sql: """
      INSERT INTO goal_contributions (goal_id, player_id, amount)
      SELECT $1, $2, $3
      FROM financial_goals g
      WHERE g.id = $1
        AND $3 >= 0
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
          OR EXISTS (
            SELECT 1 FROM club_members m
            WHERE m.club_id = g.club_id
              AND m.user_id = $4
              AND m.role::text IN ('ADMIN', 'TESORERO')
          )
        )
      ON CONFLICT (goal_id, player_id) DO UPDATE SET amount = EXCLUDED.amount
      RETURNING goal_id, player_id, amount
    """
    params: [$goalId, $playerId, $amount, { _expr: "auth.uid" }]
  )
}

mutation SaveInventoryItem(
  $id: String!
  $clubId: String!
  $name: String!
  $quantity: Int!
  $condition: String!
) @auth(level: USER) {
  item: _executeReturningFirst(
    sql: """
      INSERT INTO inventory_items (id, club_id, name, quantity, condition, created_at)
      SELECT $1, $2, $3, $4, $5::inventory_condition, CURRENT_TIMESTAMP
      WHERE $4 >= 0
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $6)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $2
              AND user_id = $6
              AND role::text IN ('ADMIN', 'DT', 'TESORERO')
          )
        )
      ON CONFLICT (id) DO UPDATE SET
        name = EXCLUDED.name,
        quantity = EXCLUDED.quantity,
        condition = EXCLUDED.condition
      RETURNING id, name, quantity
    """
    params: [$id, $clubId, $name, $quantity, $condition, { _expr: "auth.uid" }]
  )
}

mutation CreateCourtHold(
  $id: String!
  $courtId: String!
  $holdDate: Date!
  $startTime: String!
  $endTime: String!
  $note: String!
) @auth(level: USER) {
  courtHold: _executeReturningFirst(
    sql: """
      INSERT INTO court_holds (
        id, court_id, hold_date, start_time, end_time, source, note
      )
      SELECT $1, $2, $3, $4, $5, 'MANUAL', $6
      WHERE EXISTS (
        SELECT 1 FROM platform_admins WHERE user_id = $7
      )
        AND $4 < $5
        AND NOT EXISTS (
          SELECT 1 FROM court_holds h
          WHERE h.court_id = $2
            AND h.hold_date = $3
            AND h.start_time < $5
            AND $4 < h.end_time
        )
      RETURNING id, hold_date, start_time, end_time
    """
    params: [
      $id
      $courtId
      $holdDate
      $startTime
      $endTime
      $note
      { _expr: "auth.uid" }
    ]
  )
}

mutation DeleteCourtHold($id: String!) @auth(level: USER) {
  deleted: _execute(
    sql: """
      DELETE FROM court_holds
      WHERE id = $1
        AND source::text = 'MANUAL'
        AND EXISTS (
          SELECT 1 FROM platform_admins WHERE user_id = $2
        )
    """
    params: [$id, { _expr: "auth.uid" }]
  )
}
