mutation AcceptClubInvite($clubId: String!, $emailKey: String!, $token: String!, $displayName: String!)
  @auth(level: USER) {
  query @redact {
    clubInvite(key: { clubId: $clubId, emailKey: $emailKey })
      @check(expr: "this == null || this.email == auth.token.email", message: "La sesión no es del correo invitado.") {
      email
    }
  }
  ensured: _execute(
    sql: """
      INSERT INTO users (id, email, display_name, updated_at)
      SELECT $4, email, $5, CURRENT_TIMESTAMP
      FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
      ON CONFLICT (id) DO UPDATE SET
        display_name = EXCLUDED.display_name,
        updated_at = CURRENT_TIMESTAMP
    """
    params: [$clubId, $emailKey, $token, { _expr: "auth.uid" }, $displayName]
  )
  member: _executeReturningFirst(
    sql: """
      INSERT INTO club_members (club_id, user_id, email, display_name, role, joined_at)
      SELECT $1, $4, email, $5, role, CURRENT_TIMESTAMP
      FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
      ON CONFLICT (club_id, user_id) DO UPDATE SET role = EXCLUDED.role
      RETURNING user_id AS id
    """
    params: [$clubId, $emailKey, $token, { _expr: "auth.uid" }, $displayName]
  )
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $2
        AND EXISTS (
          SELECT 1 FROM club_invites
          WHERE club_id = $1 AND email_key = $2 AND token = $3
        )
    """
    params: [$clubId, $emailKey, $token]
  )
  droppedInvite: _execute(
    sql: """
      DELETE FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
    """
    params: [$clubId, $emailKey, $token]
  )
}

mutation DeclineClubInvite($clubId: String!, $emailKey: String!, $token: String!)
  @auth(level: PUBLIC, insecureReason: "Rechazar solo funciona con el token del enlace.") {
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $2
        AND EXISTS (
          SELECT 1 FROM club_invites
          WHERE club_id = $1 AND email_key = $2 AND token = $3
        )
    """
    params: [$clubId, $emailKey, $token]
  )
  invite: _executeReturningFirst(
    sql: """
      DELETE FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
      RETURNING email_key AS id
    """
    params: [$clubId, $emailKey, $token]
  )
}

