    id
    weekday
    startTime
    endTime
  }
  courts(orderBy: [{ sortOrder: ASC }, { name: ASC }]) {
    id
    name
    description
    hourlyRate
    active
    sortOrder
    imageUrl
    football
  }
  courtHolds(orderBy: [{ holdDate: ASC }, { startTime: ASC }]) {
