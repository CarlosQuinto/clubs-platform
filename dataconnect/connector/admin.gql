mutation CreateTournament(
  $userId: String! = ""
  $id: String!
  $name: String!
  $seasonId: String!
  $categoryId: String!
  $groupId: String!
  $footballType: String!
  $durationMinutes: Int!
  $startDate: Date!
  $description: String!
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  grouped: _executeReturningFirst(
    sql: """
      INSERT INTO tournament_groups (id, label)
      VALUES ($1, $2)
      ON CONFLICT (id) DO UPDATE SET label = EXCLUDED.label
      RETURNING id
    """
    params: [$groupId, $name]
  )
  tournament: _executeReturningFirst(
    sql: """
      INSERT INTO tournaments (
        id, name, season_id, category_id, group_id, status,
        legs, football_type, duration_minutes, start_date, description, created_at
      )
      VALUES (
        $1, $2, $3, $4, $5, 'UPCOMING'::tournament_status,
        2, $6::football_type, $7, $8, $9, CURRENT_TIMESTAMP
      )
      RETURNING id
    """
    params: [
      $id
      $name
      $seasonId
      $categoryId
      $groupId
      $footballType
      $durationMinutes
      $startDate
      $description
    ]
  )
}

