mutation SavePlatformAdminInvite($emailKey: String!, $email: String!) @auth(level: USER) {
  invite: _executeReturningFirst(
    sql: """
      INSERT INTO platform_admin_invites (email_key, email, invited_by_id, created_at)
      SELECT $1, $2, $3, CURRENT_TIMESTAMP
      WHERE EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
        AND NOT EXISTS (SELECT 1 FROM platform_admins WHERE lower(email) = lower($2))
      ON CONFLICT (email_key) DO NOTHING
      RETURNING email_key AS id
    """
    params: [$emailKey, $email, { _expr: "auth.uid" }]
  )
}

mutation RemovePlatformAdminInvite($emailKey: String!) @auth(level: USER) {
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $1
        AND platform
        AND EXISTS (SELECT 1 FROM platform_admin_invites WHERE email_key = $1)
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
    """
    params: [$emailKey, { _expr: "auth.uid" }]
  )
  invite: _executeReturningFirst(
    sql: """
      DELETE FROM platform_admin_invites
      WHERE email_key = $1
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
      RETURNING email_key AS id
    """
    params: [$emailKey, { _expr: "auth.uid" }]
  )
}

mutation RemovePlatformAdmin($userId: String!) @auth(level: USER) {
  admin: _executeReturningFirst(
    sql: """
      DELETE FROM platform_admins
      WHERE user_id = $1
        AND user_id <> $2
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
        AND (SELECT count(*) FROM platform_admins) > 1
      RETURNING user_id AS id
    """
    params: [$userId, { _expr: "auth.uid" }]
  )
}
