  }
  hold: _executeReturningFirst(
    sql: """
      INSERT INTO court_holds (
        id, court_id, hold_date, start_time, end_time, source, note, guest_email
      )
      VALUES ($1, $2, $3, $4, $5, 'MANUAL'::court_hold_source, $6, $7)
      ON CONFLICT (id) DO UPDATE SET
        court_id = EXCLUDED.court_id,
        hold_date = EXCLUDED.hold_date,
