mutation RejectTeamApplication($id: String!) @auth(level: USER) {
  application: _executeReturningFirst(
    sql: """
      UPDATE team_applications
      SET status = 'REJECTED', reviewed_at = CURRENT_TIMESTAMP
      WHERE id = $1 AND status::text = 'PENDING'
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
      RETURNING id
    """
    params: [$id, { _expr: "auth.uid" }]
  )
}

mutation ApproveTeamApplication(
  $id: String!
  $clubId: String!
  $slug: String!
  $localityId: String @retired
  $location: String @retired
  $description: String @retired
  $heroUrl: String @retired
  $emailKey: String @retired
  $token: String @retired
  $kind: String @retired
) @auth(level: USER) {
  application: _executeReturningFirst(
    sql: """
      UPDATE team_applications
      SET status = 'APPROVED', club_id = $2, slug = $3, reviewed_at = CURRENT_TIMESTAMP
      WHERE id = $1 AND status::text = 'PENDING'
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
      RETURNING id
    """
    params: [$id, $clubId, $slug, { _expr: "auth.uid" }]
  )
}

mutation SavePlatformAdminInvite($emailKey: String!, $email: String!) @auth(level: USER) {
  invite: _executeReturningFirst(
    sql: """
      INSERT INTO platform_admin_invites (email_key, email, invited_by_id, created_at)
      SELECT $1, lower(btrim($2)), $3, CURRENT_TIMESTAMP
      WHERE char_length(btrim($2)) BETWEEN 6 AND 320
        AND btrim($2) = lower(btrim($2))
        AND btrim($2) ~ '^[^[:space:]@]+@[^[:space:]@]+\.[a-z]{2,}$'
        AND $1 = replace(lower(btrim($2)), '.', ',')
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
        AND NOT EXISTS (SELECT 1 FROM platform_admins WHERE lower(email) = lower(btrim($2)))
        AND NOT EXISTS (
          SELECT 1 FROM platform_admin_invites
          WHERE email_key = $1 OR lower(email) = lower(btrim($2))
        )
        AND (
          SELECT count(*) FROM platform_admin_invites
          WHERE created_at > CURRENT_TIMESTAMP - INTERVAL '1 hour'
        ) < 10
      ON CONFLICT DO NOTHING
      RETURNING email_key AS id
    """
    params: [$emailKey, $email, { _expr: "auth.uid" }]
  )
}

mutation RemovePlatformAdminInvite($emailKey: String!) @auth(level: USER) {
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $1
        AND platform
        AND EXISTS (SELECT 1 FROM platform_admin_invites WHERE email_key = $1)
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
    """
    params: [$emailKey, { _expr: "auth.uid" }]
  )
  invite: _executeReturningFirst(
    sql: """
      DELETE FROM platform_admin_invites
      WHERE email_key = $1
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
      RETURNING email_key AS id
    """
    params: [$emailKey, { _expr: "auth.uid" }]
  )
}

mutation RemovePlatformAdmin($userId: String!) @auth(level: USER) {
  admin: _executeReturningFirst(
    sql: """
      DELETE FROM platform_admins
      WHERE user_id = $1
        AND user_id <> $2
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
        AND (SELECT count(*) FROM platform_admins) > 1
      RETURNING user_id AS id
    """
    params: [$userId, { _expr: "auth.uid" }]
  )
}
