  $name: String!
  $description: String!
  $hourlyRate: Float!
  $football: Boolean!
  $imageUrl: String!
  $sortOrder: Int!
  $active: Boolean!
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  court: _executeReturningFirst(
    sql: """
      INSERT INTO courts (
        id, name, description, hourly_rate, football, image_url, sort_order, active
      )
      VALUES ($1, $2, $3, $4, $5, NULLIF($6, ''), $7, $8)
      ON CONFLICT (id) DO UPDATE SET
        name = EXCLUDED.name,
        description = EXCLUDED.description,
        hourly_rate = EXCLUDED.hourly_rate,
        football = EXCLUDED.football,
        image_url = EXCLUDED.image_url,
        sort_order = EXCLUDED.sort_order,
        active = EXCLUDED.active
      RETURNING id
    """
    params: [
      $id
      $name
      $description
      $hourlyRate
      $football
      $imageUrl
      $sortOrder
      $active
    ]
  )
}

mutation DeleteCourt($id: String!) @auth(level: USER) {
  unlinked: _execute(
    sql: """
      UPDATE matches SET court_id = NULL
      WHERE court_id = $1
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
    """
    params: [$id, { _expr: "auth.uid" }]
  )
  dropped: _execute(
    sql: """
      DELETE FROM court_holds
      WHERE court_id = $1
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
    """
    params: [$id, { _expr: "auth.uid" }]
  )
  court: _executeReturningFirst(
    sql: """
      DELETE FROM courts
      WHERE id = $1
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
      RETURNING id
    """
    params: [$id, { _expr: "auth.uid" }]
  )
}

mutation SaveCourtHold(
