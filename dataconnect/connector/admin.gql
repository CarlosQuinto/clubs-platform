mutation BootstrapPlatformAdmin($userId: String!, $email: String!, $displayName: String!) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      email: $email
      displayName: $displayName
      updatedAt_expr: "request.time"
    }
  )
  admin: _executeReturningFirst(
    sql: """
      INSERT INTO platform_admins (user_id, email)
      SELECT u.id, u.email
      FROM users u
      WHERE u.id = $1
        AND NOT EXISTS (SELECT 1 FROM platform_admins)
      RETURNING user_id
    """
    params: [$userId]
  )
}

mutation ClaimPlatformAdminInvite($emailKey: String!) @auth(level: USER) {
  query @redact {
    platformAdminInvite(key: { emailKey: $emailKey })
      @check(expr: "this == null || this.email == auth.token.email", message: "La sesión no es del correo invitado.") {
      email
    }
  }
  ensured: _execute(
    sql: """
      INSERT INTO users (id, email, display_name, updated_at)
      SELECT $1, email, '', CURRENT_TIMESTAMP
      FROM platform_admin_invites
      WHERE email_key = $2
      ON CONFLICT (id) DO UPDATE SET email = EXCLUDED.email, updated_at = CURRENT_TIMESTAMP
    """
    params: [{ _expr: "auth.uid" }, $emailKey]
  )
  admin: _executeReturningFirst(
    sql: """
      INSERT INTO platform_admins (user_id, email)
      SELECT $1, email
      FROM platform_admin_invites
      WHERE email_key = $2
      ON CONFLICT (user_id) DO UPDATE SET email = EXCLUDED.email
      RETURNING user_id AS id
    """
    params: [{ _expr: "auth.uid" }, $emailKey]
  )
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $1
        AND EXISTS (SELECT 1 FROM platform_admin_invites WHERE email_key = $1)
    """
    params: [$emailKey]
  )
  droppedInvite: _execute(
    sql: """
      DELETE FROM platform_admin_invites
      WHERE email_key = $1
    """
    params: [$emailKey]
  )
}

mutation DeleteLocality($id: String!) @auth(level: USER) {
  locality: _executeReturningFirst(
    sql: """
      DELETE FROM localities
      WHERE id = $1
        AND NOT EXISTS (SELECT 1 FROM clubs WHERE locality_id = $1)
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
      RETURNING id
    """
    params: [$id, { _expr: "auth.uid" }]
  )
}

mutation CreateLocality($userId: String! = "" $id: String! $name: String!) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  locality: _executeReturningFirst(
    sql: """
      INSERT INTO localities (id, name, created_at)
      SELECT $1, initcap(btrim(regexp_replace($2, ' {2,}', ' ', 'g'))), CURRENT_TIMESTAMP
      WHERE char_length(btrim(regexp_replace($2, ' {2,}', ' ', 'g'))) BETWEEN 3 AND 50
        AND btrim(regexp_replace($2, ' {2,}', ' ', 'g')) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ,]+)( [A-Za-z0-9À-ÖØ-öø-ÿ,]+)*$'
        AND NOT EXISTS (
          SELECT 1 FROM localities
          WHERE lower(name) = lower(btrim(regexp_replace($2, ' {2,}', ' ', 'g')))
        )
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
      RETURNING id
    """
    params: [$id, $name, { _expr: "auth.uid" }]
  )
}

mutation CreateClub(
  $userId: String! = ""
  $id: String!
  $slug: String!
  $name: String!
  $localityId: String!
  $location: String!
  $presidentPhone: String!
  $description: String!
  $heroUrl: String @retired
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  club: _executeReturningFirst(
    sql: """
      INSERT INTO clubs (
        id, slug, name, description, locality_id, location, president_phone, created_at
      )
      SELECT $1, $2, btrim($3), $4, $5, btrim($6), btrim($7), CURRENT_TIMESTAMP
      WHERE char_length(btrim($3)) BETWEEN 3 AND 30
        AND btrim($3) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ.-]+)( [A-Za-z0-9À-ÖØ-öø-ÿ.-]+)*$'
        AND char_length($2) BETWEEN 3 AND 40
        AND $2 ~ '^[a-z0-9]+(-[a-z0-9]+)*$'
        AND $2 NOT IN (
          'admin', 'login', 'registro', 'invitar', 'registrar-equipo', 'contacto',
          'solicitudes', 'clubes', 'equipos', 'torneos', 'temporadas', 'categorias',
          'canchas', 'api'
        )
        AND NOT EXISTS (SELECT 1 FROM clubs WHERE slug = $2)
        AND EXISTS (SELECT 1 FROM localities WHERE id = $5)
        AND (
          btrim($6) = ''
          OR (
            char_length(btrim($6)) BETWEEN 3 AND 50
            AND btrim($6) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ,.]+)( [A-Za-z0-9À-ÖØ-öø-ÿ,.]+)*$'
          )
        )
        AND (btrim($7) = '' OR btrim($7) ~ '^\+?[0-9]{10,15}$')
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $8)
      RETURNING id
    """
    params: [
      $id
      $slug
      $name
      $description
      $localityId
      $location
      $presidentPhone
      { _expr: "auth.uid" }
    ]
  )
}

mutation InsertClubHero($userId: String! = "", $id: UUID!, $clubId: String!, $url: String!) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  hero: _executeReturningFirst(
    sql: """
      INSERT INTO club_hero_images (id, club_id, position, url)
      VALUES ($1, $2, 0, $3)
      ON CONFLICT (club_id, position) DO UPDATE SET url = EXCLUDED.url
      RETURNING club_id AS id
    """
    params: [$id, $clubId, $url]
  )
}

mutation SetClubActive($userId: String! = "" $id: String! $active: Boolean! $reason: String! = "") @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  # Desactivar exige un motivo (se muestra en la página del club); activar lo borra.
  club: _executeReturningFirst(
    sql: """
      UPDATE clubs
      SET active = $2,
          disabled_reason = CASE WHEN $2 THEN NULL ELSE btrim($3) END
      WHERE id = $1 AND deleted_at IS NULL
        AND (
          $2
          OR (
            char_length(btrim($3)) BETWEEN 5 AND 100
            AND btrim($3) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ.,:;¡!¿?()''"-]+)( [A-Za-z0-9À-ÖØ-öø-ÿ.,:;¡!¿?()''"-]+)*$'
          )
        )
      RETURNING id
    """
    params: [$id, $active, $reason]
  )
}

mutation DeleteClub($userId: String! = "" $id: String!) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  # Borrado lógico: jugadores, partidos y finanzas se conservan para el historial de la liga.
  # Los miembros se quedan (sin acceso, el club ya no se lista) por si se restaura por SQL.
  # Sigue con _executeReturningFirst: cambiar su tipo (Any → Int) rompería clientes publicados.
  invites: _executeReturningFirst(
    sql: "DELETE FROM club_invites WHERE club_id = $1 RETURNING email_key AS id"
    params: [$id]
  )
  signups: _execute(
    sql: "DELETE FROM signup_invites WHERE club_id = $1"
    params: [$id]
  )
  club: _executeReturningFirst(
    sql: """
      UPDATE clubs SET active = false, deleted_at = CURRENT_TIMESTAMP
      WHERE id = $1 AND deleted_at IS NULL
      RETURNING id
    """
    params: [$id]
  )
}

mutation SaveClubInvite(
  $clubId: String!
  $emailKey: String!
  $email: String!
  $role: String!
  $token: String!
  $kind: String!
) @auth(level: USER) {
  invite: _executeReturningFirst(
    sql: """
      INSERT INTO club_invites (club_id, email_key, email, role, token, kind, created_at)
      SELECT $1, $2, lower(btrim($3)),
        CASE $4
          WHEN 'ADMIN' THEN 'ADMIN'::member_role
          WHEN 'DT' THEN 'DT'::member_role
          WHEN 'PRENSA' THEN 'PRENSA'::member_role
          WHEN 'TESORERO' THEN 'TESORERO'::member_role
        END,
        $5,
        CASE $6
          WHEN 'SIGNUP' THEN 'SIGNUP'::invite_kind
          WHEN 'ACCEPT' THEN 'ACCEPT'::invite_kind
        END,
        CURRENT_TIMESTAMP
      WHERE char_length(btrim($3)) BETWEEN 6 AND 320
        AND btrim($3) = lower(btrim($3))
        AND btrim($3) ~ '^[^[:space:]@]+@[^[:space:]@]+\.[a-z]{2,}$'
        AND $2 = replace(lower(btrim($3)), '.', ',')
        AND $4 IN ('ADMIN', 'DT', 'PRENSA', 'TESORERO')
        AND $5 ~ '^[A-Za-z0-9]{16,64}$'
        AND $6 IN ('SIGNUP', 'ACCEPT')
        AND NOT EXISTS (
          SELECT 1 FROM club_members
          WHERE club_id = $1 AND lower(email) = lower(btrim($3))
        )
        AND NOT EXISTS (
          SELECT 1 FROM club_invites
          WHERE club_id = $1 AND (email_key = $2 OR lower(email) = lower(btrim($3)))
        )
        AND (
          SELECT count(*) FROM club_invites
          WHERE club_id = $1
            AND created_at > CURRENT_TIMESTAMP - INTERVAL '1 hour'
        ) < 20
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $7)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $1 AND user_id = $7 AND role::text = 'ADMIN'
          )
        )
      RETURNING email_key AS id
    """
    params: [$clubId, $emailKey, $email, $role, $token, $kind, { _expr: "auth.uid" }]
  )
}

mutation RemoveClubInvite($clubId: String!, $emailKey: String!) @auth(level: USER) {
  invite: _executeReturningFirst(
    sql: """
      DELETE FROM club_invites
      WHERE club_id = $1 AND email_key = $2
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $1 AND user_id = $3 AND role::text = 'ADMIN'
          )
        )
      RETURNING email_key AS id
    """
    params: [$clubId, $emailKey, { _expr: "auth.uid" }]
  )
}

mutation SaveSignupInvite($emailKey: String!, $email: String!, $clubId: String, $platform: Boolean!)
  @auth(level: USER) {
  invite: _executeReturningFirst(
    sql: """
      INSERT INTO signup_invites (email_key, email, club_id, platform, updated_at)
      SELECT $1, $2, $3, $4, CURRENT_TIMESTAMP
      WHERE EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $5)
        OR (
          NOT $4
          AND EXISTS (SELECT 1 FROM club_invites WHERE club_id = $3 AND email_key = $1)
        )
      ON CONFLICT (email_key) DO UPDATE SET
        email = EXCLUDED.email,
        club_id = COALESCE(EXCLUDED.club_id, signup_invites.club_id),
        platform = EXCLUDED.platform OR signup_invites.platform,
        updated_at = CURRENT_TIMESTAMP
      RETURNING email_key AS id
    """
    params: [$emailKey, $email, $clubId, $platform, { _expr: "auth.uid" }]
  )
}

mutation ClearSignupInvite($emailKey: String!) @auth(level: USER) {
  invite: _executeReturningFirst(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $1
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = signup_invites.club_id
              AND user_id = $2
              AND role::text = 'ADMIN'
          )
        )
      RETURNING email_key AS id
    """
    params: [$emailKey, { _expr: "auth.uid" }]
  )
}

mutation SetClubMemberRole($clubId: String!, $userId: String!, $role: String!) @auth(level: USER) {
  member: _executeReturningFirst(
    sql: """
      UPDATE club_members SET role = CASE $3
        WHEN 'ADMIN' THEN 'ADMIN'::member_role
        WHEN 'DT' THEN 'DT'::member_role
        WHEN 'PRENSA' THEN 'PRENSA'::member_role
        WHEN 'TESORERO' THEN 'TESORERO'::member_role
      END
      WHERE club_id = $1 AND user_id = $2
        AND $3 IN ('ADMIN', 'DT', 'PRENSA', 'TESORERO')
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $1 AND user_id = $4 AND role::text = 'ADMIN'
          )
        )
      RETURNING user_id AS id
    """
    params: [$clubId, $userId, $role, { _expr: "auth.uid" }]
  )
}

mutation RemoveClubMember($clubId: String!, $userId: String!) @auth(level: USER) {
  member: _executeReturningFirst(
    sql: """
      DELETE FROM club_members
      WHERE club_id = $1 AND user_id = $2
        AND (
          EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $3)
          OR EXISTS (
            SELECT 1 FROM club_members
            WHERE club_id = $1 AND user_id = $3 AND role::text = 'ADMIN'
          )
        )
      RETURNING user_id AS id
    """
    params: [$clubId, $userId, { _expr: "auth.uid" }]
  )
}

mutation AcceptClubInvite($clubId: String!, $emailKey: String!, $token: String!, $displayName: String!)
  @auth(level: USER) {
  query @redact {
    clubInvite(key: { clubId: $clubId, emailKey: $emailKey })
      @check(expr: "this == null || this.email == auth.token.email", message: "La sesión no es del correo invitado.") {
      email
    }
  }
  ensured: _execute(
    sql: """
      INSERT INTO users (id, email, display_name, updated_at)
      SELECT $4, email, $5, CURRENT_TIMESTAMP
      FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
      ON CONFLICT (id) DO UPDATE SET
        display_name = EXCLUDED.display_name,
        updated_at = CURRENT_TIMESTAMP
    """
    params: [$clubId, $emailKey, $token, { _expr: "auth.uid" }, $displayName]
  )
  member: _executeReturningFirst(
    sql: """
      INSERT INTO club_members (club_id, user_id, email, display_name, role, joined_at)
      SELECT $1, $4, email, $5, role, CURRENT_TIMESTAMP
      FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
      ON CONFLICT (club_id, user_id) DO UPDATE SET role = EXCLUDED.role
      RETURNING user_id AS id
    """
    params: [$clubId, $emailKey, $token, { _expr: "auth.uid" }, $displayName]
  )
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $2
        AND EXISTS (
          SELECT 1 FROM club_invites
          WHERE club_id = $1 AND email_key = $2 AND token = $3
        )
    """
    params: [$clubId, $emailKey, $token]
  )
  droppedInvite: _execute(
    sql: """
      DELETE FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
    """
    params: [$clubId, $emailKey, $token]
  )
}

mutation DeclineClubInvite($clubId: String!, $emailKey: String!, $token: String!)
  @auth(level: PUBLIC, insecureReason: "Rechazar solo funciona con el token del enlace.") {
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $2
        AND EXISTS (
          SELECT 1 FROM club_invites
          WHERE club_id = $1 AND email_key = $2 AND token = $3
        )
    """
    params: [$clubId, $emailKey, $token]
  )
  invite: _executeReturningFirst(
    sql: """
      DELETE FROM club_invites
      WHERE club_id = $1 AND email_key = $2 AND token = $3
      RETURNING email_key AS id
    """
    params: [$clubId, $emailKey, $token]
  )
}

mutation CreateSeason(
  $userId: String! = ""
  $id: String!
  $name: String!
  $startDate: Date
  $endDate: Date
  $active: Boolean!
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  season: _executeReturningFirst(
    sql: """
      INSERT INTO seasons (id, name, start_date, end_date, active)
      SELECT $1, $2, $3::date, $4::date, $5
      WHERE char_length($2) BETWEEN 4 AND 11
        AND $2 ~ '^[0-9]+(-[0-9]+)*$'
        AND $3 IS NOT NULL
        AND $4 IS NOT NULL
        AND $4::date > $3::date
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $6)
      RETURNING id
    """
    params: [$id, $name, $startDate, $endDate, $active, { _expr: "auth.uid" }]
  )
}

mutation SetSeasonActive($userId: String! = "" $id: String! $active: Boolean!) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  season: _executeReturningFirst(
    sql: """
      UPDATE seasons SET active = $2
      WHERE id = $1
      RETURNING id
    """
    params: [$id, $active]
  )
}

mutation DeleteSeason($userId: String! = "" $id: String!) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  season: _executeReturningFirst(
    sql: """
      DELETE FROM seasons
      WHERE id = $1
        AND NOT EXISTS (SELECT 1 FROM tournaments WHERE season_id = $1)
      RETURNING id
    """
    params: [$id]
  )
}

mutation CreateCategory(
  $userId: String! = ""
  $id: String!
  $name: String!
  $sortOrder: Int!
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  category: _executeReturningFirst(
    sql: """
      INSERT INTO categories (id, name, sort_order)
      SELECT $1, initcap(btrim(regexp_replace($2, ' {2,}', ' ', 'g'))), $3
      WHERE char_length(btrim($2)) BETWEEN 3 AND 40
        AND btrim($2) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ]+)( [A-Za-z0-9À-ÖØ-öø-ÿ]+)*$'
        AND $3 >= 0
        AND $3 <= 1000
        AND NOT EXISTS (
          SELECT 1 FROM categories
          WHERE lower(name) = lower(btrim(regexp_replace($2, ' {2,}', ' ', 'g')))
        )
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
      RETURNING id
    """
    params: [$id, $name, $sortOrder, { _expr: "auth.uid" }]
  )
}

mutation CreateTournament(
  $userId: String! = ""
  $id: String!
  $name: String!
  $seasonId: String!
  $categoryId: String!
  $groupId: String!
  $footballType: String!
  $durationMinutes: Int!
  $startDate: Date!
  $description: String!
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  grouped: _executeReturningFirst(
    sql: """
      INSERT INTO tournament_groups (id, label)
      SELECT $1, btrim($2)
      WHERE char_length(btrim($2)) BETWEEN 3 AND 50
        AND btrim($2) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ]+)( [A-Za-z0-9À-ÖØ-öø-ÿ]+)*$'
      ON CONFLICT (id) DO UPDATE SET label = EXCLUDED.label
      RETURNING id
    """
    params: [$groupId, $name]
  )
  tournament: _executeReturningFirst(
    sql: """
      INSERT INTO tournaments (
        id, name, season_id, category_id, group_id, status,
        legs, football_type, duration_minutes, start_date, description, created_at
      )
      SELECT
        $1, btrim($2), $3, $4, $5, 'UPCOMING'::tournament_status,
        2,
        CASE $6
          WHEN 'FUT_7' THEN 'FUT_7'::football_type
          WHEN 'FUT_9' THEN 'FUT_9'::football_type
          WHEN 'FUT_11' THEN 'FUT_11'::football_type
        END,
        $7, $8::date, btrim($9), CURRENT_TIMESTAMP
      WHERE char_length(btrim($2)) BETWEEN 3 AND 50
        AND btrim($2) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ]+)( [A-Za-z0-9À-ÖØ-öø-ÿ]+)*$'
        AND $6 IN ('FUT_7', 'FUT_9', 'FUT_11')
        AND $7 IN (30, 60, 90, 120)
        AND $8 IS NOT NULL
        AND (
          btrim($9) = ''
          OR btrim($9) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ.,¡!¿?-]+)( [A-Za-z0-9À-ÖØ-öø-ÿ.,¡!¿?-]+)*$'
        )
        AND char_length(btrim($9)) <= 100
        AND EXISTS (SELECT 1 FROM categories WHERE id = $4)
        AND EXISTS (
          SELECT 1 FROM seasons s
          WHERE s.id = $3
            AND (s.start_date IS NULL OR $8::date >= s.start_date)
            AND (s.end_date IS NULL OR $8::date <= s.end_date)
        )
      RETURNING id
    """
    params: [
      $id
      $name
      $seasonId
      $categoryId
      $groupId
      $footballType
      $durationMinutes
      $startDate
      $description
    ]
  )
}

# Textos y enlaces públicos: los mismos límites que el formulario, y nunca < > que armen HTML.
mutation SavePlatformHeader($name: String!, $motto: String!, $logoUrl: String!) @auth(level: USER) {
  settings: _executeReturningFirst(
    sql: """
      INSERT INTO platform_settings (
        id, name, motto, headline, tagline, logo_url,
        courts_enabled, court_slot_minutes, created_at, updated_at
      )
      SELECT 'config', btrim($1), btrim($2), '', '', btrim($3), false, 60, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
      WHERE char_length(btrim($1)) BETWEEN 2 AND 30
        AND btrim($1) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ]+)( [A-Za-z0-9À-ÖØ-öø-ÿ]+)*$'
        AND (
          btrim($2) = ''
          OR (char_length(btrim($2)) <= 50 AND btrim($2) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ.,:;¡!¿?()''"-]+)( [A-Za-z0-9À-ÖØ-öø-ÿ.,:;¡!¿?()''"-]+)*$')
        )
        AND (btrim($3) = '' OR (char_length($3) <= 1000 AND $3 ~ '^https?://[^[:space:]<>"'']+$'))
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $4)
      ON CONFLICT (id) DO UPDATE SET
        name = EXCLUDED.name,
        motto = EXCLUDED.motto,
        logo_url = EXCLUDED.logo_url,
        updated_at = CURRENT_TIMESTAMP
      RETURNING id
    """
    params: [$name, $motto, $logoUrl, { _expr: "auth.uid" }]
  )
}

