mutation SaveCourtHold(
  $userId: String! = ""
  $id: String!
  $courtId: String!
  $holdDate: Date!
  $startTime: String!
  $endTime: String!
  $note: String!
  $guestEmail: String! = ""
  $fresh: Boolean! = false
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  # La nota llega como "Nombre · Nota". Nombre: letras y espacios, 3 a 30, en Title Case.
  # Nota: opcional, hasta 50. Correo obligatorio. Fecha desde ayer en UTC (hoy en México).
  # El tramo cae en la rejilla, dentro de la apertura de ese día y sin cruzarse con otro.
  saved: _execute(
    sql: """
      INSERT INTO court_holds (
        id, court_id, hold_date, start_time, end_time, source, note, guest_email
      )
      SELECT
        $1,
        $2,
        $3,
        $4,
        $5,
        'MANUAL'::court_hold_source,
        initcap(split_part(btrim($6), ' · ', 1))
          || CASE WHEN strpos(btrim($6), ' · ') > 0
               THEN ' · ' || split_part(btrim($6), ' · ', 2)
               ELSE '' END,
        lower(btrim($7))
      WHERE EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $8)
        AND EXISTS (SELECT 1 FROM courts WHERE id = $2)
        AND $3 >= CURRENT_DATE - 1
        AND btrim($6) ~ '^[A-Za-zÀ-ÖØ-öø-ÿ]+( [A-Za-zÀ-ÖØ-öø-ÿ]+)*( · [A-Za-zÀ-ÖØ-öø-ÿ0-9.,¡!¿?-]+( [A-Za-zÀ-ÖØ-öø-ÿ0-9.,¡!¿?-]+)*)?$'
        AND char_length(split_part(btrim($6), ' · ', 1)) BETWEEN 3 AND 30
        AND char_length(split_part(btrim($6), ' · ', 2)) <= 50
        AND char_length(btrim($7)) <= 320
        AND lower(btrim($7)) ~ '^[a-z0-9._%+-]+@([a-z0-9-]+[.])+[a-z]{2,10}$'
        AND CASE
          WHEN $4 ~ '^([01][0-9]|2[0-3]):[0-5][0-9]$' AND $5 ~ '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          THEN $4 < $5
            AND (split_part($4, ':', 1)::int * 60 + split_part($4, ':', 2)::int)
              % (SELECT court_slot_minutes FROM platform_settings WHERE id = 'config') = 0
            AND (split_part($5, ':', 1)::int * 60 + split_part($5, ':', 2)::int)
              % (SELECT court_slot_minutes FROM platform_settings WHERE id = 'config') = 0
          ELSE false
        END
        AND EXISTS (
          SELECT 1 FROM court_open_windows w
          WHERE w.weekday = EXTRACT(ISODOW FROM $3::date)
            AND w.start_time <= $4
            AND $5 <= w.end_time
        )
        AND NOT EXISTS (
          SELECT 1 FROM court_holds h
          WHERE h.court_id = $2
            AND h.hold_date = $3
            AND h.id <> $1
            AND h.start_time < $5
            AND $4 < h.end_time
        )
      ON CONFLICT (id) DO UPDATE SET
        court_id = EXCLUDED.court_id,
        hold_date = EXCLUDED.hold_date,
        start_time = EXCLUDED.start_time,
        end_time = EXCLUDED.end_time,
        note = EXCLUDED.note,
        guest_email = EXCLUDED.guest_email
      WHERE court_holds.source::text = 'MANUAL'
        AND court_holds.hold_date >= CURRENT_DATE - 1
    """
    params: [
      $id
      $courtId
      $holdDate
      $startTime
      $endTime
      $note
      $guestEmail
      { _expr: "auth.uid" }
    ]
  )
  # Dos apartados nuevos al mismo tiempo pueden pasar ambos el NOT EXISTS de arriba.
  # El que llega y ya ve otro cruzado se quita a sí mismo; al menos uno de los dos lo ve.
  race: _execute(
    sql: """
      DELETE FROM court_holds h
      WHERE h.id = $1
        AND $2
        AND h.source::text = 'MANUAL'
        AND EXISTS (
          SELECT 1 FROM court_holds o
          WHERE o.court_id = h.court_id
            AND o.hold_date = h.hold_date
            AND o.id <> h.id
            AND o.start_time < h.end_time
            AND h.start_time < o.end_time
        )
    """
    params: [$id, $fresh]
  )
  hold: _executeReturningFirst(
    sql: """
      SELECT id FROM court_holds
      WHERE id = $1
        AND court_id = $2
        AND hold_date = $3
        AND start_time = $4
        AND end_time = $5
        AND lower(note) = lower(btrim($6))
        AND guest_email = lower(btrim($7))
    """
    params: [$id, $courtId, $holdDate, $startTime, $endTime, $note, $guestEmail]
  )
}

