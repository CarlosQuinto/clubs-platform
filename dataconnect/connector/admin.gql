mutation SaveCourt(
  $userId: String! = ""
  $id: String!
  $name: String!
  $description: String!
  $hourlyRate: Float!
  $football: Boolean!
  $imageUrl: String!
  $sortOrder: Int!
  $active: Boolean!
) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  court: _executeReturningFirst(
    sql: """
      INSERT INTO courts (
        id, name, description, hourly_rate, football, image_url, sort_order, active
      )
      SELECT
        $1,
        initcap(btrim($2)),
        btrim($3),
        round($4::numeric, 2),
        $5,
        NULLIF(btrim($6), ''),
        $7,
        $8
      WHERE char_length(btrim($2)) BETWEEN 3 AND 15
        AND btrim($2) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ]+)( [A-Za-z0-9À-ÖØ-öø-ÿ]+)*$'
        AND char_length(btrim($3)) BETWEEN 3 AND 15
        AND btrim($3) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ.,-]+)( [A-Za-z0-9À-ÖØ-öø-ÿ.,-]+)*$'
        AND $4 >= 0
        AND round($4::numeric, 2) <= 99999999.99
        AND (
          btrim($6) = ''
          OR (char_length($6) <= 2048 AND $6 ~ '^https://[^[:space:]<>"'']+$')
        )
        AND $7 BETWEEN 0 AND 100000
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $9)
      ON CONFLICT (id) DO UPDATE SET
        name = EXCLUDED.name,
        description = EXCLUDED.description,
        hourly_rate = EXCLUDED.hourly_rate,
        football = EXCLUDED.football,
        image_url = EXCLUDED.image_url,
        sort_order = EXCLUDED.sort_order,
        active = EXCLUDED.active
      RETURNING id
    """
    params: [
      $id
      $name
      $description
      $hourlyRate
      $football
      $imageUrl
      $sortOrder
      $active
      { _expr: "auth.uid" }
    ]
  )
}

