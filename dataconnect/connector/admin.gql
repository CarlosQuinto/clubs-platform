# Operaciones del panel /admin. Cada escritura exige una fila en platform_admins.

query AmIPlatformAdmin @auth(level: USER) {
  platformAdmins(where: { userId: { eq_expr: "auth.uid" } }, limit: 1) {
    email
  }
}

query PlatformAdminById($id: String!) @auth(level: USER) {
  platformAdmin(key: { userId: $id }) {
    email
  }
}

query ClubAdminGate($clubId: String!, $userId: String!) @auth(level: USER) {
  platformAdmin(key: { userId: $userId }) {
    email
  }
  clubMember(key: { clubId: $clubId, userId: $userId }) {
    role
  }
}

query SignupInviteByEmail($emailKey: String!)
  @auth(level: PUBLIC, insecureReason: "El registro comprueba si ese correo fue invitado.") {
  signupInvite(key: { emailKey: $emailKey }) {
    email
    platform
    club { id }
  }
}

query ClubInviteLookup($clubId: String!, $emailKey: String!, $token: String!)
  @auth(level: PUBLIC, insecureReason: "La invitación se abre con el enlace que incluye el token.") {
  clubInvites(
    where: {
      club: { id: { eq: $clubId } }
      emailKey: { eq: $emailKey }
      token: { eq: $token }
    }
    limit: 1
  ) {
    email
    role
    kind
    token
    club { id name slug }
  }
}

query AdminClubs
  @auth(level: USER) {
  localities(orderBy: [{ name: ASC }]) {
    id
    name
  }
  clubs(orderBy: [{ name: ASC }]) {
    id
    slug
    name
    location @retired
    presidentPhone @retired
    active
    locality { id name @retired }
  }
}

query AdminClubPeople($clubId: String!) @auth(level: USER) {
  clubMembers(where: { club: { id: { eq: $clubId } } }) {
    email
    displayName
    role
    user { id }
  }
  clubInvites(where: { club: { id: { eq: $clubId } } }) {
    emailKey
    email
    role
    token
    kind
  }
}

query AdminCompetition @auth(level: USER) {
  seasons(orderBy: [{ startDate: DESC }]) {
    id
    name
    startDate
    endDate
    active
  }
  categories(orderBy: [{ sortOrder: ASC }]) {
    id
    name
    sortOrder
  }
  tournaments {
    id
    season { id }
  }
}

query AdminCover @auth(level: USER) {
  platformSettings(id: "config") {
    name
    motto
    headline
    tagline
    logoUrl
    instagram
    facebook
    x
    youtube
    whatsapp
  }
  platformHeroImages(orderBy: [{ position: ASC }]) {
    id
    position
    url
  }
}

query AdminAds @auth(level: USER) {
  ads(orderBy: [{ sortOrder: ASC }, { brand: ASC }]) {
    id
    brand
    imageUrl
    href
    startsOn
    endsOn
    status
    sortOrder
    adPlacements_on_ad { placement }
  }
}

query AdminInbox @auth(level: USER) {
  localities(orderBy: [{ name: ASC }]) { id name }
  inquiries(orderBy: [{ createdAt: DESC }]) {
    id
    name
    email
    phone
    topic
    message
    status
    createdAt
  }
  teamApplications(orderBy: [{ createdAt: DESC }]) {
    id
    captainName
    captainEmail
    captainPhone
    teamName
    status
    slug
    createdAt
    club { id }
  }
}

query AdminAdmins @auth(level: USER) {
  platformAdmins {
    email
    user { id displayName }
  }
  platformAdminInvites(orderBy: [{ email: ASC }]) {
    emailKey
    email
  }
}

query MyPlatformAdminInvite($emailKey: String!) @auth(level: USER) {
  platformAdminInvite(key: { emailKey: $emailKey }) {
    email
  }
}

query AdminCourts($from: Date @retired) @auth(level: USER) {
  platformSettings(id: "config") {
    courtsEnabled
    courtSlotMinutes
  }
  courtOpenWindows(orderBy: [{ weekday: ASC }, { startTime: ASC }]) {
    id
    weekday
    startTime
    endTime
  }
  courts(orderBy: [{ sortOrder: ASC }, { name: ASC }]) {
    id
    name
    description
    hourlyRate
    active
    sortOrder
    imageUrl
    football
  }
  courtHolds(orderBy: [{ holdDate: ASC }, { startTime: ASC }]) {
    id
    holdDate
    startTime
    endTime
    source
    note
    guestEmail
    court { id }
    match { id homeClub { name } awayClub { name } tournament { durationMinutes } }
  }
}

mutation BootstrapPlatformAdmin($userId: String!, $email: String!, $displayName: String!) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      email: $email
      displayName: $displayName
      updatedAt_expr: "request.time"
    }
  )
  admin: _executeReturningFirst(
    sql: """
      INSERT INTO platform_admins (user_id, email)
      SELECT u.id, u.email
      FROM users u
      WHERE u.id = $1
        AND NOT EXISTS (SELECT 1 FROM platform_admins)
      RETURNING user_id
    """
    params: [$userId]
  )
}

mutation ClaimPlatformAdminInvite($emailKey: String!) @auth(level: USER) {
  query @redact {
    platformAdminInvite(key: { emailKey: $emailKey })
      @check(expr: "this == null || this.email == auth.token.email", message: "La sesión no es del correo invitado.") {
      email
    }
  }
  ensured: _execute(
    sql: """
      INSERT INTO users (id, email, display_name, updated_at)
      SELECT $1, email, '', CURRENT_TIMESTAMP
      FROM platform_admin_invites
      WHERE email_key = $2
      ON CONFLICT (id) DO UPDATE SET email = EXCLUDED.email, updated_at = CURRENT_TIMESTAMP
    """
    params: [{ _expr: "auth.uid" }, $emailKey]
  )
  admin: _executeReturningFirst(
    sql: """
      INSERT INTO platform_admins (user_id, email)
      SELECT $1, email
      FROM platform_admin_invites
      WHERE email_key = $2
      ON CONFLICT (user_id) DO UPDATE SET email = EXCLUDED.email
      RETURNING user_id AS id
    """
    params: [{ _expr: "auth.uid" }, $emailKey]
  )
  droppedSignup: _execute(
    sql: """
      DELETE FROM signup_invites
      WHERE email_key = $1
        AND EXISTS (SELECT 1 FROM platform_admin_invites WHERE email_key = $1)
    """
    params: [$emailKey]
  )
  droppedInvite: _execute(
    sql: """
      DELETE FROM platform_admin_invites
      WHERE email_key = $1
    """
    params: [$emailKey]
  )
}

mutation DeleteLocality($id: String!) @auth(level: USER) {
  locality: _executeReturningFirst(
    sql: """
      DELETE FROM localities
      WHERE id = $1
        AND NOT EXISTS (SELECT 1 FROM clubs WHERE locality_id = $1)
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
      RETURNING id
    """
    params: [$id, { _expr: "auth.uid" }]
  )
}

mutation CreateLocality($userId: String! = "" $id: String! $name: String!) @auth(level: USER) {
  query {
    platformAdmin(key: { userId: $userId }) @check(message: "No se pudo guardar.") {
      user { id }
    }
  }
  locality: _executeReturningFirst(
    sql: """
      INSERT INTO localities (id, name, created_at)
      VALUES ($1, btrim($2), CURRENT_TIMESTAMP)
      RETURNING id
    """
    params: [$id, $name]
  )
}

