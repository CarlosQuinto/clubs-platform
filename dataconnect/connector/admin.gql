    sql: """
      INSERT INTO clubs (
        id, slug, name, description, locality_id, location, president_phone, created_at
      )
      VALUES ($1, $2, $3, $4, $5, $6, $7, CURRENT_TIMESTAMP)
      ON CONFLICT (slug) DO UPDATE SET name = EXCLUDED.name
      RETURNING id
