mutation SaveAd(
  $id: String!
  $brand: String!
  $imageUrl: String!
  $href: String!
  $startsOn: Date!
  $endsOn: Date!
  $status: String!
  $sortOrder: Int!
) @auth(level: USER) {
  ad: _executeReturningFirst(
    sql: """
      INSERT INTO ads (
        id, brand, image_url, href, starts_on, ends_on, status, sort_order, created_at
      )
      SELECT $1, btrim($2), $3, $4, $5, $6, $7::ad_status, $8, CURRENT_TIMESTAMP
      WHERE char_length(btrim($2)) BETWEEN 2 AND 50
        AND btrim($2) ~ '^([A-Za-z0-9À-ÖØ-öø-ÿ]+)( [A-Za-z0-9À-ÖØ-öø-ÿ]+)*$'
        AND char_length($3) <= 2000 AND $3 ~ '^https?://[^[:space:]<>"'']+$'
        AND ($4 = '' OR (char_length($4) <= 500 AND $4 ~ '^https?://[^[:space:]<>"'']+$'))
        AND $6 > $5
        /* Un anuncio nuevo no arranca en el pasado. Un día de holgura por la zona horaria del navegador. */
        AND ($5 >= CURRENT_DATE - 1 OR EXISTS (SELECT 1 FROM ads WHERE id = $1))
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $9)
      ON CONFLICT (id) DO UPDATE SET
        brand = EXCLUDED.brand,
        image_url = EXCLUDED.image_url,
        href = EXCLUDED.href,
        starts_on = EXCLUDED.starts_on,
        ends_on = EXCLUDED.ends_on,
        status = EXCLUDED.status,
        sort_order = EXCLUDED.sort_order
      RETURNING id
    """
    params: [$id, $brand, $imageUrl, $href, $startsOn, $endsOn, $status, $sortOrder, { _expr: "auth.uid" }]
  )
}

