# Redes en minúsculas, salvo el id de canal de YouTube. WhatsApp solo dígitos.
mutation SavePlatformSocial(
  $instagram: String!
  $facebook: String!
  $x: String!
  $youtube: String!
  $whatsapp: String!
) @auth(level: USER) {
  settings: _executeReturningFirst(
    sql: """
      INSERT INTO platform_settings (
        id, name, motto, headline, tagline, instagram, facebook, x, youtube, whatsapp,
        courts_enabled, court_slot_minutes, created_at, updated_at
      )
      SELECT
        'config', '', '', '', '',
        lower($1), lower($2), lower($3),
        CASE WHEN $4 ~* '/channel/' THEN $4 ELSE lower($4) END,
        $5,
        false, 60, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
      WHERE ($1 = '' OR (char_length($1) <= 150 AND $1 ~ '^[^[:space:]<>"'']+$'))
        AND ($2 = '' OR (char_length($2) <= 150 AND $2 ~ '^[^[:space:]<>"'']+$'))
        AND ($3 = '' OR (char_length($3) <= 150 AND $3 ~ '^[^[:space:]<>"'']+$'))
        AND ($4 = '' OR (char_length($4) <= 150 AND $4 ~ '^[^[:space:]<>"'']+$'))
        AND ($5 = '' OR $5 ~ '^[0-9]{10,13}$')
        AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $6)
      ON CONFLICT (id) DO UPDATE SET
        instagram = EXCLUDED.instagram,
        facebook = EXCLUDED.facebook,
        x = EXCLUDED.x,
        youtube = EXCLUDED.youtube,
        whatsapp = EXCLUDED.whatsapp,
        updated_at = CURRENT_TIMESTAMP
      RETURNING id
    """
    params: [$instagram, $facebook, $x, $youtube, $whatsapp, { _expr: "auth.uid" }]
  )
}

# Reemplaza el carrusel en una sola sentencia: hasta 6 URLs separadas por espacio (una URL nunca lo lleva).
mutation ReplaceHeroImages($urls: String!) @auth(level: USER) {
  images: _executeReturningFirst(
    sql: """
      WITH input AS (
        SELECT url, (ord - 1)::int AS position
        FROM unnest(string_to_array(btrim($1), ' ')) WITH ORDINALITY AS t(url, ord)
        WHERE url <> ''
      ),
      ok AS (
        SELECT 'config'::text AS id
        WHERE (SELECT count(*) FROM input) <= 6
          AND NOT EXISTS (
            SELECT 1 FROM input
            WHERE char_length(url) > 2000 OR url !~ '^https?://[^[:space:]<>"'']+$'
          )
          AND EXISTS (SELECT 1 FROM platform_admins WHERE user_id = $2)
      ),
      saved AS (
        INSERT INTO platform_hero_images (id, position, url)
        SELECT gen_random_uuid(), position, url FROM input
        WHERE EXISTS (SELECT 1 FROM ok)
        ON CONFLICT (position) DO UPDATE SET url = EXCLUDED.url
        RETURNING position
      ),
      trimmed AS (
        DELETE FROM platform_hero_images
        WHERE EXISTS (SELECT 1 FROM ok)
          AND position >= (SELECT count(*) FROM input)
        RETURNING position
      )
      SELECT id FROM ok
    """
    params: [$urls, { _expr: "auth.uid" }]
  )
}

