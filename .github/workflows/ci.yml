# Integración continua: comprueba tipos, build, guarda «sin Firebase», migraciones SQL (Postgres embebido)
# y que las imágenes Docker del frontend y de la API se construyen. No despliega: el despliegue es
# `docker compose` en tu servidor (ver README, sección Despliegue).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:firebase
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_ANON_KEY: ci
      - run: npm run demo:sql
      - run: npm run db:check -- --quiet
      - run: npm ci
        working-directory: api
      - run: npm run build
        working-directory: api

  imagenes:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          build-args: |
            VITE_SUPABASE_URL=http://localhost:8000
            VITE_SUPABASE_ANON_KEY=ci
      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
