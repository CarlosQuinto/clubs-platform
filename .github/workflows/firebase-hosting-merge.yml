# Despliega a Firebase Hosting (canal "live") en cada push a main.
#
# Configuración requerida en el repositorio de GitHub:
#   Settings → Secrets and variables → Actions
#   - Secret  FIREBASE_SERVICE_ACCOUNT  : JSON de la cuenta de servicio (firebase init hosting:github lo genera)
#   - Secret  VITE_FIREBASE_*           : mismos valores que tu .env local
#   - Variable FIREBASE_PROJECT_ID      : ID del proyecto de Firebase
#
# Si FIREBASE_SERVICE_ACCOUNT no está definido, el build se ejecuta igualmente
# (para validar el código) y el paso de despliegue se omite.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - if: env.HAS_FIREBASE_CREDENTIALS == 'false'
        run: echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT no configurado; se omite el despliegue."
      - if: env.HAS_FIREBASE_CREDENTIALS == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
